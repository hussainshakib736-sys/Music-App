<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse Music Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;
    600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">P</div>
          <div>
            <p class="brand-name">Pulse</p>
            <span class="brand-tag">Radio</span>
          </div>
        </div>

        <div class="playlist-header">
          <h2>Playlist</h2>
          <button class="mini-btn" type="button">+ Add</button>
        </div>

        <ul id="playlist" class="playlist"></ul>
      </aside>

      <main class="player-panel">
        <div class="art-panel">
          <img id="albumArt" src="" alt="Album art" />
          <div class="art-overlay">
            <span>Now playing</span>
          </div>
        </div>

        <div class="track-info">
          <p class="eyebrow">Featured Track</p>
          <h1 id="songTitle">Song Title</h1>
          <h2 id="artistName">Artist Name</h2>
        </div>

        <div class="timeline-row">
          <span id="currentTime">0:00</span>
          <input id="progressBar" type="range" min="0" max="100" value="0" />
          <span id="totalTime">0:00</span>
        </div>

        <div class="controls-row">
          <button id="prevBtn" class="control-btn" type="button" aria-label="Previous track">⏮</button>
          <button id="playPauseBtn" class="play-btn" type="button" aria-label="Play or pause">▶</button>
          <button id="nextBtn" class="control-btn" type="button" aria-label="Next track">⏭</button>
        </div>

        <div class="bottom-row">
          <button id="autoplayBtn" class="secondary-btn active" type="button">Autoplay: On</button>

          <div class="volume-box">
            <span class="volume-icon">🔊</span>
            <input id="volumeControl" type="range" min="0" max="1" step="0.01" value="0.7" />
          </div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
